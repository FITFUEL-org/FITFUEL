name: Build and deploy to Hostinger

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Check public build settings
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          for setting in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!setting}" ]; then
              echo "::error::Missing GitHub Actions repository variable: $setting"
              exit 1
            fi
          done

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Check deployment settings
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          HOSTINGER_FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          HOSTINGER_FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          HOSTINGER_FTP_SERVER_DIR: ${{ vars.HOSTINGER_FTP_SERVER_DIR }}
        run: |
          for setting in HOSTINGER_FTP_SERVER HOSTINGER_FTP_USERNAME HOSTINGER_FTP_PASSWORD HOSTINGER_FTP_SERVER_DIR; do
            if [ -z "${!setting}" ]; then
              echo "::error::Missing GitHub Actions setting: $setting"
              exit 1
            fi
          done

      - name: Deploy to Hostinger over FTPS (attempt 1)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: ftp_deploy_attempt_1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ${{ vars.HOSTINGER_FTP_SERVER_DIR }}
          timeout: 120000

      - name: Deploy to Hostinger over FTPS (attempt 2)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.ftp_deploy_attempt_1.outcome == 'failure'
        id: ftp_deploy_attempt_2
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ${{ vars.HOSTINGER_FTP_SERVER_DIR }}
          timeout: 120000

      - name: Deploy to Hostinger over FTPS (attempt 3)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.ftp_deploy_attempt_1.outcome == 'failure' && steps.ftp_deploy_attempt_2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ${{ vars.HOSTINGER_FTP_SERVER_DIR }}
          timeout: 120000
